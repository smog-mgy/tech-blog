# 技术博客站点配置
site_name: 我的技术博客
site_description: 记录学习、项目与踩坑的技术博客
site_author: smog-mgy

theme:
  name: material
  language: zh
  features:
    - navigation.top        # 顶部导航
    - navigation.footer     # 底部导航
    - content.code.copy     # 代码块复制按钮
    - toc.integrate         # 右侧目录
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition                      # 提示框（!!! note 等）
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences            # 代码块增强
  - pymdownx.inlinehilite           # 行内代码高亮
  - toc:
      permalink: true               # 标题锚点

nav:
  - 首页: index.md
  - 关于我: about.md
  - 技术文章:
      - 关于Agent开发的Python函数进阶: posts/关于Agent开发的Python函数进阶.md
      - 关于Agent开发的Python面向对象进阶: posts/关于Agent开发的Python面向对象进阶.md
      - 关于Agent开发的Python模块化与工程结构: posts/关于Agent开发的Python模块化与工程结构.md
      - 关于Agent开发的Git基础与分支管理: posts/关于Agent开发的Git基础与分支管理.md
      - 写Todo命令行项目的收获: posts/写Todo命令行项目的收获.md
      - PyTorch框架学习笔记: posts/PyTorch框架学习笔记.md
      - 神经网络基础学习笔记: posts/神经网络基础学习笔记.md
      - 卷积神经网络学习笔记: posts/卷积神经网络学习笔记.md
      - 循环神经网络学习笔记: posts/循环神经网络学习笔记.md
      - LLM主要架构学习笔记: posts/LLM主要架构学习笔记.md
      - LLM主流开源大模型学习笔记: posts/LLM主流开源大模型学习笔记.md
